<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#08090D">

    <title>Tic-Tac-Toe</title>

    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/typography.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/visual-test.css">
</head>
<body>
    <main class="visual-test">
        <div class="visual-test__content">
            <p class="visual-test__eyebrow">Visual foundation test</p>

            <h1 class="visual-test__title">A full-screen game surface.</h1>

            <p class="visual-test__description">
                Testing responsive sizing, safe-area spacing, and restrained
                purple and cyan lighting before designing the actual screens.
            </p>

            <div class="visual-test__markers" aria-label="Visual elements being tested">
                <span class="visual-test__marker visual-test__marker--purple">
                    Purple glow
                </span>

                <span class="visual-test__marker visual-test__marker--cyan">
                    Cyan glow
                </span>

                <span class="visual-test__marker">
                    Responsive grid
                </span>
            </div>
        </div>
    </main>
</body>
</html>
